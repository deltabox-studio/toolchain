name: Toolchain sync
on:
  push:
    branches: [main, dev]
  pull_request: null
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
      - name: Install dependencies
        run: yarn install --immutable
      - name: Verify generated files are in sync
        run: yarn dbx sync --check
