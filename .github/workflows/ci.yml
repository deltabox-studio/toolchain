# Generated by @deltabox/toolchain — edit dbx.config.* and run `dbx sync`.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - dev
      - release/**
      - feat/**
      - feature/**
      - fix/**
      - chore/**
      - dependabot/**
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
      - name: Install dependencies
        run: yarn install --immutable
      - name: Commitlint (Conventional Commits)
        if: "${{ github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000' }}"
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.event.after }}"
          yarn commitlint --from "$base" --to "$head" --config commitlint.config.mjs
      - name: Verify generated files are in sync
        run: yarn dbx sync --check
      - name: Build
        run: yarn build
      - name: Format + lint (auto-fix)
        run: yarn check:fix
      - name: Test
        run: yarn test
      - name: Typecheck (build tsconfig)
        run: yarn typecheck:ci
      - name: Generate config docs + schema
        run: yarn config:generate
      - name: Verify generated config artifacts are up to date
        run: |
          yarn format
          git diff --exit-code -- apps/docs/config/reference.md apps/docs/config/index.md apps/docs/config/cli.md apps/docs/config/env.md config.schema.json
      - name: Build docs
        run: yarn docs build
