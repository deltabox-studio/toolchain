# Hand-written release workflow (not managed by `dbx sync`; the generated
# `release` workflow is disabled in dbx.config.ts).
#
# On every push to `main` it releases the current version once:
#   - packages the VS Code extension into a `.vsix`,
#   - creates the `v<version>` tag + a GitHub Release whose notes come from
#     CHANGELOG.md and whose asset is the `.vsix`,
#   - publishes `@deltabox/toolchain` to npm,
#   - publishes/updates the extension on the VS Code Marketplace.
#
# It is idempotent: if the `v<version>` tag already exists it does nothing, so
# ordinary pushes to `main` are no-ops.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Resolve version + release state
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package the VS Code extension
        if: steps.release.outputs.skip == 'false'
        run: yarn workspace toolchain-vscode package:vsix

      - name: Extract release notes
        if: steps.release.outputs.skip == 'false'
        run: |
          notes="$(awk '/<!-- release:start -->/{f=1;next} /<!-- release:end -->/{exit} f{print}' CHANGELOG.md 2>/dev/null || true)"
          [ -n "$notes" ] || notes="Release v${{ steps.release.outputs.version }}"
          printf '%s\n' "$notes" > RELEASE_NOTES.md

      - name: Create the GitHub Release
        if: steps.release.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.release.outputs.version }}" \
            --title "v${{ steps.release.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            "packages/vscode/deltabox-toolchain.vsix"

      - name: Publish to npm
        if: steps.release.outputs.skip == 'false'
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: yarn npm publish --tolerate-republish

      - name: Publish to the VS Code Marketplace
        if: steps.release.outputs.skip == 'false'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath packages/vscode/deltabox-toolchain.vsix
