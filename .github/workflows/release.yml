# Generated by @deltabox/toolchain.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch: null
permissions:
  contents: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  create-release-pr:
    name: release
    runs-on: ubuntu-latest
    environment: toolchain / release
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Enable Corepack
        run: |-
          corepack enable
          corepack prepare yarn@4.17.1 --activate
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - name: Resolve version + release state
        id: release
        run: |-
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "versionClean=${version%%-*}" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "versionClean=$version" >> "$GITHUB_OUTPUT"
          fi
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published."
            echo "npmPublished=true" >> "$GITHUB_OUTPUT"
          else
            echo "npmPublished=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Package the VS Code extension
        if: steps.release.outputs.skip == 'false'
        run: |-
          if [[ "${{ steps.release.outputs.prerelease }}" == "true" ]]; then
            node -e 'const fs = require("fs"); const p = "packages/vscode/package.json"; const j = JSON.parse(fs.readFileSync(p, "utf8")); j.version = "${{ steps.release.outputs.versionClean }}"; fs.writeFileSync(p, JSON.stringify(j, null, 4) + "\n");'
            yarn workspace toolchain-vscode package:vsix:prerelease
          else
            yarn workspace toolchain-vscode package:vsix
          fi
      - name: Extract release notes
        if: steps.release.outputs.skip == 'false'
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |-
          notes="$(yarn dbx changelog --release-body "${{ steps.release.outputs.version }}")"
          [ -n "$notes" ] || notes="Release v${{ steps.release.outputs.version }}"
          printf '%s\n' "$notes" > RELEASE_NOTES.md
      - name: Create the GitHub Release
        if: steps.release.outputs.skip == 'false'
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |-
          version="${{ steps.release.outputs.version }}"
          args=(--title "v$version" --notes-file RELEASE_NOTES.md)
          prerelease="auto"
          if [ "$prerelease" = "true" ] || { [ "$prerelease" = "auto" ] && [[ "$version" == *-* ]]; }; then
            args+=(--prerelease)
          fi
          gh release create "v$version" "${args[@]}" "packages/vscode/deltabox-toolchain.vsix"
      - name: Upgrade npm for trusted publishing
        if: steps.release.outputs.skip == 'false' || steps.release.outputs.npmPublished == 'false'
        run: npm install -g npm@^11.15.1
      - name: "Publish to npm (fallback: staged)"
        if: steps.release.outputs.npmPublished == 'false'
        run: |-
          version="${{ steps.release.outputs.version }}"
          if [[ "$version" == *-* ]]; then
            npm_tag="${version#*-}"
            npm_tag="${npm_tag%%[.+]*}"
          else
            npm_tag="latest"
          fi
          yarn pack --out toolchain.tgz
          if npm publish toolchain.tgz --access public --tag "$npm_tag"; then
            echo "Published to npm (tag: $npm_tag)."
          else
            echo "::warning::Direct publish failed; falling back to a staged publish."
            npm stage publish toolchain.tgz --access public --tag "$npm_tag"
          fi
      - name: Publish stale workspace packages
        if: steps.release.outputs.skip == 'false' || steps.release.outputs.npmPublished == 'false'
        run: node scripts/publish-workspaces.mjs
