trigger:
  tags:
    include:
      - v*
  branches:
    exclude:
      - '*'
pr: none

variables:
  nodeVersion: '22.x'
  minNpmVersion: '11.15.1'
  packageManager: 'yarn'
  yarnVersion: '4.17.1'
  extensionWorkspaceDir: 'packages/vscode'

stages:
- stage: 'Check'
  displayName: 'Check the published extension version'
  jobs:
  - job: 'CheckJob'
    displayName: 'Check whether the version is already published'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
      fetchDepth: 1

    # Reads `$(extensionWorkspaceDir)/package.json` and queries the VS Code
    # Marketplace for that version. `alreadyPublished` is exposed as a stage
    # output so the Build/Release stages can skip when it is `true`.
    - task: PowerShell@2
      name: 'CheckStep'
      displayName: 'Query the VS Code Marketplace for the current version'
      inputs:
        pwsh: true
        targetType: 'inline'
        script: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content '$(extensionWorkspaceDir)/package.json' -Raw | ConvertFrom-Json
          $id = "$($pkg.publisher).$($pkg.name)"
          $version = $pkg.version
          Write-Host "Checking $id v$version on the VS Code Marketplace..."

          $published = $false
          try {
            $body = @{
              filters = @(@{ criteria = @(@{ filterType = 7; value = $id }) })
              flags   = 1
            } | ConvertTo-Json -Depth 10
            $response = Invoke-RestMethod -Method Post -ContentType 'application/json' `
              -Headers @{ Accept = 'application/json;api-version=7.2-preview.1' } `
              -Uri 'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery' `
              -Body $body
            $versions = @($response.results[0].extensions[0].versions | ForEach-Object { $_.version })
            $published = $versions -contains $version
          } catch {
            Write-Warning "Could not query the VS Code Marketplace; assuming not published. $_"
          }

          Write-Host "extension=$id version=$version alreadyPublished=$published"
          Write-Host "##vso[task.setvariable variable=extensionVersion;isOutput=true]$version"
          Write-Host "##vso[task.setvariable variable=alreadyPublished;isOutput=true]$($published.ToString().ToLowerInvariant())"
          if ($published) {
            Write-Host "##[warning]$id v$version is already published to the VS Code Marketplace; skipping the build and release stages."
          }

- stage: 'Build'
  displayName: 'Build the monorepo'
  dependsOn: Check
  condition: and(succeeded(), ne(dependencies.Check.outputs['CheckJob.CheckStep.alreadyPublished'], 'true'))
  jobs: 
  - job: 'Build'
    displayName: 'Build job'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - script: 'echo "$(Build.DefinitionName), $(Build.BuildId), $(Build.BuildNumber)" > buildinfo.txt'
      displayName: 'Write build info'

    - task: UseNode@1
      displayName: 'Use node $(nodeVersion)'
      inputs:
        version: $(nodeVersion)

    - script: |
        npm install -g npm@^$(minNpmVersion)
      displayName: 'Upgrade npm'

    - script: |
        corepack enable
        corepack prepare $(packageManager)@$(yarnVersion) --activate
      displayName: 'Enable corepack'

    - script: |
        $(packageManager) install --immutable
      displayName: 'Install dependencies'

    - task: CopyFiles@2
      inputs:
        sourceFolder: '.'
        contents: |
          CHANGELOG.md
        targetFolder: $(extensionWorkspaceDir)
      displayName: 'Copy changelog from root'

    - task: PowerShell@2
      name: 'PrereleaseStep'
      displayName: 'Detect a pre-release extension version'
      inputs:
        pwsh: true
        targetType: 'inline'
        script: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content '$(extensionWorkspaceDir)/package.json' -Raw | ConvertFrom-Json
          $isPrerelease = $pkg.version -match '-'
          Write-Host "extension version=$($pkg.version) prerelease=$isPrerelease"
          Write-Host "##vso[task.setvariable variable=prerelease;isOutput=true]$($isPrerelease.ToString().ToLowerInvariant())"

    - script: |
        node -e 'const fs=require("fs");const p="$(extensionWorkspaceDir)/package.json";const j=JSON.parse(fs.readFileSync(p,"utf8"));const v=j.version;if(v.includes("-")){j.version=v.split("-")[0];fs.writeFileSync(p,JSON.stringify(j,null,4)+"\n");console.log("Normalized pre-release "+v+" to "+j.version);}'
      displayName: 'Normalize a pre-release extension version'

    - script: |
        $(packageManager) build
      displayName: 'Build workspaces and the VSIX extension'

    # The regular build packages a stable VSIX. Marketplace pre-releases are
    # flagged at package time, so repackage with --pre-release before publishing.
    - script: |
        $(packageManager) workspace toolchain-vscode package:vsix:prerelease
      displayName: 'Repackage the VSIX as a pre-release'
      condition: eq(variables['PrereleaseStep.prerelease'], 'true')

    - task: CopyFiles@2
      inputs:
        sourceFolder: $(extensionWorkspaceDir)
        contents: |
          *.vsix
        targetFolder: $(Build.ArtifactStagingDirectory)
      displayName: 'Copy VSIX to artifacts'

    - publish: '$(Build.ArtifactStagingDirectory)'
      artifact: drop
  
- stage: 'Release'
  displayName: 'Deploy VS Code extension to the release environment'
  dependsOn:
  - Check
  - Build
  condition: and(succeeded(), ne(dependencies.Check.outputs['CheckJob.CheckStep.alreadyPublished'], 'true'))
  jobs:
  - deployment: Deploy
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'release'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - checkout: self
            fetchDepth: 1

          - task: PowerShell@2
            name: 'PrereleaseStep'
            displayName: 'Detect a pre-release extension version'
            inputs:
              pwsh: true
              targetType: 'inline'
              script: |
                $ErrorActionPreference = 'Stop'
                $pkg = Get-Content '$(Build.SourcesDirectory)/$(extensionWorkspaceDir)/package.json' -Raw | ConvertFrom-Json
                $isPrerelease = $pkg.version -match '-'
                Write-Host "extension version=$($pkg.version) prerelease=$isPrerelease"
                Write-Host "##vso[task.setvariable variable=prerelease;isOutput=true]$($isPrerelease.ToString().ToLowerInvariant())"

          - task: AzureCLI@2
            displayName: 'Publish to the VS Code Marketplace using managed identity'
            inputs:
              azureSubscription: $(connection-service-name)
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                cd $(Pipeline.Workspace)/drop
                $params = @('--yes', '@vscode/vsce', 'publish', '--packagePath', 'deltabox-toolchain.vsix', '--azure-credential')
                if ('$(PrereleaseStep.prerelease)' -eq 'true') {
                  $params += '--pre-release'
                }
                npx @params
