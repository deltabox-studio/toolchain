trigger:
  pr: none
  tags:
    include:
      - v*
  branches:
    include:
      - refs/tags/v*
    exclude:
      - '*'
      - refs/*

variables:
  nodeVersion: '22.x'
  minNpmVersion: '11.15.1'
  packageManager: 'yarn'
  yarnVersion: '4.17.1'
  extensionWorkspaceDir: 'packages/vscode'

stages:
- stage: 'Build'
  displayName: 'Build the monorepo'
  jobs: 
  - job: 'Build'
    displayName: 'Build job'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - script: 'echo "$(Build.DefinitionName), $(Build.BuildId), $(Build.BuildNumber)" > buildinfo.txt'
      displayName: 'Write build info'

    - task: UseNode@1
      displayName: 'Use node $(nodeVersion)'
      inputs:
        version: $(nodeVersion)

    - script: |
        npm install -g npm@^$(minNpmVersion)
      displayName: 'Upgrade npm'

    - script: |
        corepack enable
        corepack prepare $(packageManager)@$(yarnVersion) --activate
      displayName: 'Enable corepack'

    - script: |
        $(packageManager) install --immutable
      displayName: 'Install dependencies'

    - task: CopyFiles@2
      inputs:
        sourceFolder: '.'
        contents: |
          CHANGELOG.md
        targetFolder: $(extensionWorkspaceDir)
      displayName: 'Copy changelog from root'

    - script: |
        $(packageManager) build
      displayName: 'Build workspaces and the VSIX extension'

    - task: CopyFiles@2
      inputs:
        sourceFolder: $(extensionWorkspaceDir)
        contents: |
          *.vsix
        targetFolder: $(Build.ArtifactStagingDirectory)
      displayName: 'Copy VSIX to artifacts'

    - publish: '$(Build.ArtifactStagingDirectory)'
      artifact: drop
  
- stage: 'Release'
  displayName: 'Deploy VS Code extension to the release environment'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: Deploy
    pool:
      vmImage: 'ubuntu-latest'
    environment:
      name: 'release'
      resourceType: none
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureCLI@2
            displayName: 'Publish to the VS Code Marketplace using managed identity'
            inputs:
              azureSubscription: $(connection-service-name)
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                cd $(Pipeline.Workspace)/drop
                npx --yes @vscode/vsce publish --packagePath deltabox-toolchain.vsix --azure-credential
